<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Gør siden mobilvenlig uden automatisk zoom -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

    <title>Bryrup Pizza og Grill</title>

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;  /* ❌ ingen horizontal scroll */
            overflow-y: auto;    /* ✔️ normal vertikal scroll */
        }

        .iframe-container {
            width: 100%;
            min-height: 100vh; /* sikrer fuld højde */
            overflow: visible;
        }

        iframe {
            width: 100%;
            height: 100vh;  /* fuld højde pr. “skærm” */
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="iframe-container">
        <iframe src="https://bryrup-pizza-revamp.lovable.app/" allowfullscreen></iframe>
    </div>
</body>
</html>f
